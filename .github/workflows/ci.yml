name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint, type-check, and unit tests: the same `make check` you run locally.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml, so CI never
      # silently resolves different versions than the ones you tested locally.
      - run: uv sync --locked
      - run: make check

  # Tests that need a real Postgres (@pytest.mark.integration): migrations, the COPY sink.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports: ["5432:5432"]
        # The job's steps start only once this health check passes.
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # The Redis half of the admission-store contract suite runs against this.
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RELAY_DATABASE_URL: postgresql://relay:relay@localhost:5432/relay
      RELAY_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true
      - run: uv sync --locked
      - run: make migrate
      - run: make test-integration

  # Compressed fault scenarios (PRD §11.4: "short chaos smoke" per PR). Simulators and Relay
  # run as localhost subprocesses; no Docker, no network. Asserts documented behavior with
  # spread-tolerant thresholds, not exact numbers (interleaving isn't deterministic).
  chaos-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true
      - run: uv sync --locked
      - run: make chaos-smoke

  # Proves the image builds and the whole stack comes up healthy (PRD M0: "make up starts the stack").
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml up -d --build --wait
      - run: curl --fail --silent --show-error http://localhost:8000/healthz
      # End to end: create an API key with the CLI inside the image, call Relay with it, and
      # check the request lands as a row in Postgres (migrate ran, auth works, the writer
      # flushed). Without a key the call would be a 401. The flush interval is 0.5 s.
      - run: |
          KEY=$(docker compose -f deploy/docker-compose.yml exec -T api \
            python -m relay.auth create-key --tenant dev 2>/dev/null)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/models)" = 401
          curl --fail -sS http://localhost:8000/v1/chat/completions \
            -H "Authorization: Bearer $KEY" \
            -H 'content-type: application/json' \
            -d '{"model": "relay/auto", "messages": [{"role": "user", "content": "smoke"}]}'
          sleep 2
          test "$(docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -U relay -tAc 'select count(*) from requests')" -ge 1
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
