name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint, type-check, and unit tests: the same `make check` you run locally.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml, so CI never
      # silently resolves different versions than the ones you tested locally.
      - run: uv sync --locked
      - run: make check

  # Tests that need a real Postgres (@pytest.mark.integration): migrations, the COPY sink.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports: ["5432:5432"]
        # The job's steps start only once this health check passes.
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # The Redis half of the admission-store contract suite runs against this.
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RELAY_DATABASE_URL: postgresql://relay:relay@localhost:5432/relay
      RELAY_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true
      - run: uv sync --locked
      - run: make migrate
      - run: make test-integration

  # Compressed fault scenarios: a short chaos smoke on every PR. Simulators and Relay
  # run as localhost subprocesses; no Docker, no network. Asserts documented behavior with
  # spread-tolerant thresholds, not exact numbers (interleaving isn't deterministic).
  chaos-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true
      - run: uv sync --locked
      - run: make chaos-smoke

  # The demo page: TypeScript must compile under strict settings, and its logic tests must pass.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test

  # Proves the self-hosted path works, from a clean checkout and with no provider keys: the stack
  # builds and comes up healthy, the first API key is printed once, a request without it is
  # refused and one with it is answered, and the request is recorded in Postgres.
  self-host-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m scripts.smoke
      - if: failure()
        run: docker compose -p relaysmoke logs

  # The README's quickstart, run exactly as written: a quickstart nobody runs goes stale.
  readme-quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m scripts.readme_quickstart
      - if: failure()
        run: docker compose -p relayquickstart logs
