name: Release image

# Publishes the container image to the GitHub Container Registry when a version is tagged
# (git tag v1.2.3 && git push --tags). `latest` follows the newest release and never a push to
# main, so pulling it can never hand someone an unreleased change.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write       # push to ghcr.io
  id-token: write       # sign the build provenance
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # amd64 and arm64: the second is what a Raspberry Pi, a Mac under Docker and most free
      # cloud VMs run. Emulated, so this is slow; it only runs when a version is tagged.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          # `latest` is set by the semver rule above only for a release tag.
          flavor: latest=true
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
