[project]
name = "relay"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway with reliability, cost control, and evidence-grade routing decisions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.143.2",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "scipy>=1.18.1",
    "sniffio>=1.3.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff also formats Python snippets inside Markdown; the docs' snippets are illustrative.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax
    "SIM",      # simplifications
    "ASYNC",    # async pitfalls, e.g. blocking calls inside async functions
    "RUF",      # ruff-specific
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# `bench/` (chaos and load harnesses) is a top-level package that tests import.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# importlib mode lets test files in different folders share a basename.
# Live tests hit real providers (and cost money); integration tests need `make up`.
addopts = "--import-mode=importlib --strict-markers -m \"not live and not integration and not chaos\""
markers = [
    "live: calls real provider APIs; excluded by default, run only with the user's approval",
    "integration: needs the docker-compose stack (Postgres/Redis) running",
    "chaos: starts simulator and Relay subprocesses and runs compressed fault scenarios (make chaos-smoke)",
]

[tool.coverage.run]
source = ["relay"]
branch = true

[dependency-groups]
dev = [
    "anthropic>=1.15.0",
    "asyncpg-stubs>=0.32.0",
    "httpx2>=2.14.0",
    "hypothesis>=6.170.5",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "openai>=3.35.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "scikit-learn>=1.9.1",
    "scipy-stubs>=1.18.1.1",
    "types-pyyaml>=6.0.12.20260906",
]
