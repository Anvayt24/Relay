# A plain round-robin load balancer in front of the Relay replicas. `api` resolves to every
# replica's address (Docker DNS), so scaling the service scales the upstream pool.
worker_processes auto;
worker_rlimit_nofile 65536;
events { worker_connections 16384; }
http {
  access_log off;
  upstream relay {
    server api:8000;
    keepalive 256;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://relay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;   # SSE streams must not be buffered
    }
  }
}
