# Prometheus *pulls* metrics: every scrape_interval it GETs /metrics from each target.
# "api" resolves through the compose network's built-in DNS (one name per service).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: relay-api
    # One target per replica: a DNS lookup of "api" returns every container behind the name,
    # so scaling the gateway (`--scale api=2`) needs no edit here. The metrics port is not
    # published to the host.
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 9464
