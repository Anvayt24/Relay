# Local stack for Relay. Start with `make up`, stop with `make down`.
# Image versions are pinned on purpose: a floating tag (":latest") can change underneath
# you and break `make reproduce`. Bump them deliberately.

name: relay

# Shared by api and migrate. Both build the same image; the second build is served from the
# layer cache.
x-relay-image: &relay-image
  build:
    context: ..
    dockerfile: Dockerfile
  environment:
    RELAY_ENV: dev
    RELAY_DATABASE_URL: postgresql://relay:relay@postgres:5432/relay
    # HMAC secret for API-key hashes. A fixed value is fine for local dev only; production
    # gets it from a secret manager. `python -m relay.auth` must use the same one.
    RELAY_KEY_PEPPER: local-dev-pepper-change-me
    # Shared admission state: rate limits, budgets, provider pauses (Phase 6).
    RELAY_REDIS_URL: redis://redis:6379/0
  # Provider keys (GROQ_API_KEY, ...) from the repo's .env, if it exists. Never baked into
  # the image.
  env_file:
    - path: ../.env
      required: false

services:
  # One-shot: applies SQL migrations, then exits. api waits for it to *succeed*
  # (service_completed_successfully), so the requests table exists before the first request.
  migrate:
    <<: *relay-image
    command: ["python", "-m", "relay.telemetry.migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *relay-image
    ports:
      - "8000:8000"
    depends_on:
      # Relay itself can start and serve without Postgres (degradation matrix). This ordering
      # is a local-dev convenience, so a fresh stack logs from its first request.
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl, so use the Python that's already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay   # local dev only
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run once, when the data volume is first created.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    # No healthcheck: the image is distroless (no shell, curl, or wget) so nothing can run a
    # probe inside it. `--wait` treats "running" as ready for services without a healthcheck.

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin   # local dev only
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
