# Relay, self-hosted.
#
#   docker compose up -d                                  # gateway + Postgres + Redis
#   docker compose --profile observability up -d          # ... plus Prometheus, Grafana, Tempo
#
# From the repository root (compose.yaml includes this file). Only the gateway is published,
# and only on localhost unless RELAY_BIND says otherwise. Everything it needs to run is
# generated on the first start and kept in the `relaydata` volume: see guide/self-hosting.md.
#
# Image versions are pinned on purpose: a floating tag (":latest") can change underneath you.
# Bump them deliberately.

name: relay

# Shared by api and migrate. Both build the same image; the second build is served from the
# layer cache.
x-relay-image: &relay-image
  build:
    context: ..
    dockerfile: Dockerfile
  environment: &relay-env
    RELAY_ENV: ${RELAY_ENV:-prod}
    RELAY_DATABASE_URL: postgresql://relay:${POSTGRES_PASSWORD:-relay}@postgres:5432/relay
    # Shared admission state: rate limits, budgets, provider pauses.
    RELAY_REDIS_URL: redis://redis:6379/0
    RELAY_LOG_FORMAT: json
    # Spans go to the collector when the observability profile is on (set in .env).
    RELAY_OTEL_ENDPOINT: ${RELAY_OTEL_ENDPOINT:-}
  # Provider keys (GROQ_API_KEY, ...) and any other RELAY_* setting from the repo's .env.
  # Never baked into the image.
  env_file:
    - path: ../.env
      required: false

services:
  # One-shot: applies SQL migrations, then exits. api waits for it to *succeed*
  # (service_completed_successfully), so the tables exist before the first request.
  migrate:
    <<: *relay-image
    command: ["python", "-m", "relay.telemetry.migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *relay-image
    environment:
      <<: *relay-env
      # Secrets the gateway generates for itself live here, so a first run needs none.
      RELAY_DATA_DIR: /data
      # Metrics on their own port, which is not published; Prometheus scrapes it inside the
      # compose network.
      RELAY_METRICS_PORT: "9464"
    ports:
      - "${RELAY_BIND:-127.0.0.1}:${RELAY_PORT:-8000}:8000"
    volumes:
      - relaydata:/data
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl, so use the Python that's already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: relay
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run once, when the data volume is first created.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- observability profile: metrics, traces and dashboards ---------------------------------
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - tempo
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    # No healthcheck: the image is distroless (no shell, curl, or wget) so nothing can run a
    # probe inside it. `--wait` treats "running" as ready for services without a healthcheck.

  # Trace store: the collector forwards spans here; Grafana reads them on :3200.
  tempo:
    profiles: [observability]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Set GRAFANA_PASSWORD in .env. Left empty, Grafana keeps its built-in password and asks
      # you to change it at first login.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"   # the dashboards; localhost only
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  relaydata:
